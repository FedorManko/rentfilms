databaseChangeLog:
  - changeSet:
      id: create-table-films-to-rent
      author: f.manko
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: films_to_rent
      changes:
        - createTable:
            tableName: films_to_rent
            remarks: Films to rent table
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: title, type: varchar(64), constraints: { nullable: false, unique: true } }
              - column: { name: type, type: varchar(16), constraints: { nullable: false } }
              - column: { name: quantity, type: integer, constraints: { nullable: false } }
              - column: { name: version, type: integer, constraints: { nullable: false } }
              - column: { name: deleted, type: boolean, defaultValue: false, constraints: { nullable: false} }


